<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounding Ball - p5.js</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body>
    <div id="container">
        <h1>Bouncing Ball Simulation</h1>
        <h2>By: Bogdan Kaleb García Rivera</h2>
        <div id="canvas-container"></div>
        
        <div class="controls">
            <div class="control-row">
                <div class="slider-container">
                    <label for="speedSlider">Speed: <span id="speedValue">5</span></label>
                    <input type="range" id="speedSlider" min="1" max="15" value="5">
                </div>
                <div class="slider-container">
                    <label for="sizeSlider">Ball Size: <span id="sizeValue">40</span></label>
                    <input type="range" id="sizeSlider" min="10" max="100" value="40">
                </div>
            </div>
            
            <div class="control-row">
                <div class="slider-container">
                    <label for="gravitySlider">Gravity: <span id="gravityValue">0.1</span></label>
                    <input type="range" id="gravitySlider" min="0" max="0.5" step="0.01" value="0.1">
                </div>
                <div class="slider-container">
                    <label for="bounceSlider">Bounce Energy: <span id="bounceValue">0.85</span></label>
                    <input type="range" id="bounceSlider" min="0.5" max="1" step="0.01" value="0.85">
                </div>
            </div>
            
            <div class="instructions">
                <p>Click and drag to throw the ball | Press SPACE to pause/resume | Press 'R' to reset</p>
            </div>
            
            <div class="status">
                <div>Position: (<span id="posX">0</span>, <span id="posY">0</span>)</div>
                <div>Velocity: (<span id="velX">0</span>, <span id="velY">0</span>)</div>
                <div>Edge collisions: <span id="collisionCount">0</span></div>
            </div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
